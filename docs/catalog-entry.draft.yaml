name: warden
repo: https://github.com/catalystberry842-alt/warden
sha: 06f1bed77de40347de576346b4f0dbafb3d5a6b0
version: "0.1.0"
description: "Two guards for Hermes turns: a destructive-command gate that sends rm -rf, force pushes, git reset --hard, DROP/TRUNCATE, DELETE without WHERE, prisma/drizzle resets, kubectl delete and terraform destroy to the human approval prompt, and a fake-done check that flags replies claiming tests passed, commits, pushes, fixes or deploys when no matching tool ran this turn. Disclosure: no network, no telemetry, no credentials, no files written; in-memory bounded state; fail-open on internal errors. Limitation: the approve action follows Hermes approval mode, so YOLO skips it unless gate_mode is block."
maintainer: catalystberry842-alt
tier: community
category: tools
requires_hermes: ">=0.21.0"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - transform_llm_output
    - post_llm_call
    - pre_verify
  provides_middleware: []
  requires_env: []
